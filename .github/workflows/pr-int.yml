name: Build and Analyze

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3' # or your preferred version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage
      
      - name: Check lcov.info
        run: |
          ls -lh coverage/lcov.info
          head -n 20 coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: 9a172b62d89001bd0748104e111f57eb360a2f6c
        with:
          args: >
            -Dsonar.projectKey=ProCircleTeam_pro-mobile
            -Dsonar.organization=procircleteam
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=lib
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/*.g.dart
            -Dsonar.login=9a172b62d89001bd0748104e111f57eb360a2f6c

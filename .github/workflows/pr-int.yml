name: Analyze and Run test coverage

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Install dependencies
        run: |
          flutter pub get
          dart pub global activate coverage

      - name: Generate and Process Coverage
        run: |
          flutter test --coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib \
            --base-directory=$(pwd) \
            --check-ignore
          sed -i "s|^SF:.*/lib|SF:lib|g" coverage/lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: 3d539b15-e100-4724-abd7-5c339d87522c
    
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: 9a172b62d89001bd0748104e111f57eb360a2f6c
        with:
          args: >
            -Dsonar.projectKey=ProCircleTeam_pro-mobile
            -Dsonar.organization=procircleteam
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.dart.coverage.reportPath=coverage/lcov.info
            -Dsonar.exclusions=**/*.g.dart
            -Dsonar.cpd.exclusions=**/*.g.dart
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.verbose=true

name: Build and Analyze

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub global activate coverage

      - name: Generate coverage
        run: |
          flutter test --coverage
          flutter pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib \
            --base-directory=$(pwd) \
            --check-ignore

      - name: Verify LCOV file
        run: |
          echo "LCOV file content:"
          cat coverage/lcov.info
          echo "File size:"
          ls -lh coverage/lcov.info
          echo "First 10 lines:"
          head -n 10 coverage/lcov.info
          echo "Last 10 lines:"
          tail -n 10 coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: 9a172b62d89001bd0748104e111f57eb360a2f6c
        with:
          args: >
            -Dsonar.projectKey=ProCircleTeam_pro-mobile
            -Dsonar.organization=procircleteam
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.coverageReportPaths=coverage/lcov.info
            -Dsonar.dart.coverage.reportPath=coverage/lcov.info
            -Dsonar.exclusions=**/*.g.dart
            -Dsonar.cpd.exclusions=**/*.g.dart
            -Dsonar.sourceEncoding=UTF-8